# Hyperparameters for DQN training on LunarLander-v3
env_name: "LunarLander-v3"

# Training
episodes: 1000
max_steps_per_episode: 1000
solve_score: 200.0        # rolling-100 average considered "solved"
solve_window: 100

# DQN
gamma: 0.99                # discount factor
learning_rate: 0.0005
batch_size: 64
buffer_size: 100000
min_buffer_before_train: 1000

# Exploration (epsilon-greedy)
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 0.995        # multiplicative decay per episode

# Target network
target_update_every: 4      # soft update frequency (in learning steps)
tau: 0.001                  # soft update coefficient

# Network architecture
hidden_sizes: [128, 128]

# Misc
seed: 42
save_path: "models/dqn_lunarlander.pth"
plot_path: "results/training_rewards.png"
